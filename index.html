<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Surendiran V</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%2327D166'>✝</text></svg>">
    <link rel="stylesheet" href="css/splash.css">
</head>
<body>
    <!-- Animated Background Particles -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Splash Content -->
    <div class="splash-container">
        <!-- Animated Logo -->
        <div class="logo-container">
            <div class="logo-circle">
                <svg class="logo-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#27D166;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#3be67d;stop-opacity:1" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <text x="100" y="120" class="logo-text" fill="url(#logoGradient)" filter="url(#glow)">SV</text>
                </svg>
            </div>
            <div class="logo-ring"></div>
            <div class="logo-ring-2"></div>
        </div>

        <!-- Welcome Text -->
        <div class="welcome-text">
            <h1 class="welcome-title">Welcome to the World of</h1>
            <h2 class="name-title">Surendiran V</h2>
            <div class="role-container">
                <span class="role-prefix">A Passionate</span>
                <span class="role-text" id="roleText">Educator</span>
            </div>
        </div>

        <!-- Futuristic Loading Bar -->
        <div class="loading-section">
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar">
                    <div class="loading-shine"></div>
                </div>
                <div class="loading-glow"></div>
            </div>
            <div class="loading-text">
                <span id="loadingPercent">0</span>%
                <span class="loading-status">Initializing Experience...</span>
            </div>
        </div>

        <!-- Decorative Elements -->
        <div class="corner-decor top-left"></div>
        <div class="corner-decor top-right"></div>
        <div class="corner-decor bottom-left"></div>
        <div class="corner-decor bottom-right"></div>
    </div>

    <!-- Audio Element (Optional) -->
    <!-- <audio id="whooshSound" src="assets/whoosh.mp3" preload="auto"></audio> -->

    <script src="js/splash.js"></script>
</body>
</html>
